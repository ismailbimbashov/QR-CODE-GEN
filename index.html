<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Generate QR codes from any URL or text instantly. Free, fast, and fully customizable." />
    <title>QRGen — QR Code Generator</title>

    <link rel="icon" type="image/png" href="img/qr.png" />

    <!-- Inter typeface via Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>

    <!-- ══════════════════════════════════════════════════════════════════
         Site Header
         ═══════════════════════════════════════════════════════════════ -->
    <header class="site-header" role="banner">
      <div class="site-header__inner container">
        <a class="site-header__brand" href="/" aria-label="QRGen — Home">
          <!-- QR code icon -->
          <svg class="site-header__logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true" focusable="false">
            <path d="M3 3h7v7H3V3zm2 2v3h3V5H5zm8-2h7v7h-7V3zm2 2v3h3V5h-3zM3 14h7v7H3v-7zm2 2v3h3v-3H5zm11-2h2v2h-2v-2zm-3 0h2v2h-2v-2zm-1 3h2v2h-2v-2zm4 0h2v-2h3v2h-1v2h-2v2h-2v-2h-2v-2h2v-2zm2 2v2h2v-2h-2z"/>
          </svg>
          <span class="site-header__name">QRGen</span>
        </a>
      </div>
    </header>

    <!-- ══════════════════════════════════════════════════════════════════
         Main Content
         ═══════════════════════════════════════════════════════════════ -->
    <main class="main" id="main">
      <div class="container">

        <!-- Hero -->
        <div class="hero">
          <h1 class="hero__title">QR Code Generator</h1>
          <p class="hero__subtitle">Turn any URL, text, or data into a scannable QR code — instantly.</p>
        </div>

        <!-- App Card (two-panel layout) -->
        <div class="app-card">

          <!-- ── Left Panel: Configuration Form ── -->
          <section class="app-card__panel app-card__panel--form" aria-label="QR code settings">
            <form id="qr-form" class="qr-form" novalidate aria-describedby="form-desc">
              <p id="form-desc" class="sr-only">Configure your QR code options and click Generate.</p>

              <!-- Text / URL input -->
              <div class="form-group">
                <label class="form-group__label" for="qr-input">
                  URL or Text
                  <span class="form-group__required" aria-label="required field">*</span>
                </label>
                <input
                  class="form-group__input"
                  id="qr-input"
                  type="text"
                  placeholder="https://example.com or any text…"
                  autocomplete="off"
                  spellcheck="false"
                  aria-required="true"
                  aria-describedby="input-error"
                />
                <p class="form-group__error" id="input-error" role="alert" aria-live="assertive" hidden></p>
              </div>

              <!-- Output size -->
              <div class="form-group">
                <label class="form-group__label" for="qr-size">Output Size</label>
                <select class="form-group__select" id="qr-size">
                  <option value="128">Small — 128 × 128 px</option>
                  <option value="256" selected>Medium — 256 × 256 px</option>
                  <option value="512">Large — 512 × 512 px</option>
                </select>
              </div>

              <!-- Color pickers (two-column row) -->
              <div class="form-row">
                <div class="form-group">
                  <span class="form-group__label" id="label-fg">QR Color</span>
                  <label class="color-picker" for="qr-fg-color" aria-labelledby="label-fg">
                    <span class="color-picker__swatch" id="fg-swatch" style="background:#000000" aria-hidden="true"></span>
                    <span class="color-picker__hex" id="fg-hex">#000000</span>
                    <input
                      class="color-picker__native"
                      type="color"
                      id="qr-fg-color"
                      value="#000000"
                      aria-label="QR code foreground color"
                    />
                  </label>
                </div>

                <div class="form-group">
                  <span class="form-group__label" id="label-bg">Background</span>
                  <label class="color-picker" for="qr-bg-color" aria-labelledby="label-bg">
                    <span class="color-picker__swatch" id="bg-swatch" style="background:#ffffff" aria-hidden="true"></span>
                    <span class="color-picker__hex" id="bg-hex">#FFFFFF</span>
                    <input
                      class="color-picker__native"
                      type="color"
                      id="qr-bg-color"
                      value="#ffffff"
                      aria-label="QR code background color"
                    />
                  </label>
                </div>
              </div>

              <!-- Error correction level -->
              <div class="form-group">
                <label class="form-group__label" for="qr-error-level">
                  Error Correction
                  <span
                    class="tooltip"
                    tabindex="0"
                    aria-label="Higher correction means the QR code remains scannable even when partially damaged — but increases its visual density."
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" width="14" height="14" aria-hidden="true">
                      <path fill-rule="evenodd" d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0zm-7-4a1 1 0 1 1-2 0 1 1 0 0 1 2 0zM9 9a.75.75 0 0 0 0 1.5h.253a.25.25 0 0 1 .244.304l-.459 2.066A1.75 1.75 0 0 0 10.747 15H11a.75.75 0 0 0 0-1.5h-.253a.25.25 0 0 1-.244-.304l.459-2.066A1.75 1.75 0 0 0 9.253 9H9z" clip-rule="evenodd"/>
                    </svg>
                  </span>
                </label>
                <select class="form-group__select" id="qr-error-level">
                  <option value="L">Low — 7% data recovery</option>
                  <option value="M" selected>Medium — 15% data recovery</option>
                  <option value="Q">Quartile — 25% data recovery</option>
                  <option value="H">High — 30% data recovery</option>
                </select>
              </div>

              <!-- Generate button -->
              <button class="btn btn--primary btn--full" type="submit" id="generate-btn">
                <!-- Spinner shown during loading state via CSS -->
                <svg class="btn__spinner" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false" width="18" height="18">
                  <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.5" stroke-dasharray="14 42" stroke-linecap="round"/>
                </svg>
                <span class="btn__label">Generate QR Code</span>
              </button>

            </form>
          </section>

          <!-- ── Right Panel: Preview ── -->
          <section class="app-card__panel app-card__panel--preview" aria-label="QR code preview">

            <!-- Preview area -->
            <div class="qr-preview" id="qr-preview">

              <!-- Placeholder (shown before first generation) -->
              <div class="qr-preview__placeholder" id="qr-placeholder">
                <svg class="qr-preview__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
                  <rect x="5"  y="5"  width="38" height="38" rx="4" fill="none" stroke="currentColor" stroke-width="4"/>
                  <rect x="15" y="15" width="18" height="18" rx="1" fill="currentColor" opacity=".35"/>
                  <rect x="57" y="5"  width="38" height="38" rx="4" fill="none" stroke="currentColor" stroke-width="4"/>
                  <rect x="67" y="15" width="18" height="18" rx="1" fill="currentColor" opacity=".35"/>
                  <rect x="5"  y="57" width="38" height="38" rx="4" fill="none" stroke="currentColor" stroke-width="4"/>
                  <rect x="15" y="67" width="18" height="18" rx="1" fill="currentColor" opacity=".35"/>
                  <rect x="57" y="57" width="10" height="10" fill="currentColor" opacity=".35"/>
                  <rect x="72" y="57" width="10" height="10" fill="currentColor" opacity=".35"/>
                  <rect x="87" y="57" width="10" height="10" fill="currentColor" opacity=".35"/>
                  <rect x="57" y="72" width="10" height="10" fill="currentColor" opacity=".35"/>
                  <rect x="87" y="72" width="10" height="10" fill="currentColor" opacity=".35"/>
                  <rect x="57" y="87" width="10" height="10" fill="currentColor" opacity=".35"/>
                  <rect x="72" y="87" width="10" height="10" fill="currentColor" opacity=".35"/>
                </svg>
                <p class="qr-preview__placeholder-text">Your QR code will appear here</p>
              </div>

              <!-- Generated QR code (hidden until first generation) -->
              <div
                class="qr-preview__output"
                id="qr-output"
                tabindex="-1"
                aria-label="Generated QR code"
                hidden
              ></div>

            </div>

            <!-- Download action -->
            <div class="qr-actions">
              <button class="btn btn--secondary btn--full" type="button" id="download-btn" disabled aria-label="Download QR code as a PNG image">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="btn__icon" aria-hidden="true" focusable="false" width="17" height="17">
                  <path fill-rule="evenodd" d="M12 2.25a.75.75 0 0 1 .75.75v11.69l3.22-3.22a.75.75 0 1 1 1.06 1.06l-4.5 4.5a.75.75 0 0 1-1.06 0l-4.5-4.5a.75.75 0 1 1 1.06-1.06l3.22 3.22V3a.75.75 0 0 1 .75-.75zm-9 13.5a.75.75 0 0 1 .75.75v2.25a1.5 1.5 0 0 0 1.5 1.5h13.5a1.5 1.5 0 0 0 1.5-1.5V16.5a.75.75 0 0 1 1.5 0v2.25a3 3 0 0 1-3 3H5.25a3 3 0 0 1-3-3V16.5a.75.75 0 0 1 .75-.75z" clip-rule="evenodd"/>
                </svg>
                Download PNG
              </button>
            </div>

          </section>

        </div><!-- /.app-card -->
      </div><!-- /.container -->
    </main>

    <!-- ══════════════════════════════════════════════════════════════════
         Site Footer
         ═══════════════════════════════════════════════════════════════ -->
    <footer class="site-footer" role="contentinfo">
      <div class="container">
        <p class="site-footer__text">
          Built with vanilla JS &middot;
          Powered by <a href="https://github.com/davidshimjs/qrcodejs" target="_blank" rel="noopener noreferrer">qrcode.js</a>
        </p>
      </div>
    </footer>

    <!-- qrcode.js by davidshimjs — renders to <canvas> for reliable PNG export -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <!-- type="module" defers automatically and enables ES6 import/export -->
    <script type="module" src="./js/main.js"></script>

  </body>
</html>
